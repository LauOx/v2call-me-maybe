[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "numpy",
    "llm_sdk",
]
[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

exclude = [
    "^playground/",
    "^moulinette/",
    "^llm_sdk/",
    "^\\.venv/",
]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]


[dependency-groups]
dev = [
    "mypy>=1.10",
]